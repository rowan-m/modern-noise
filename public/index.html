<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A modern noise machine for today's world — white, pink, and brown noise alongside screaming, construction, traffic, beeping, and spooky soundscapes."
    />
    <meta name="theme-color" content="#403c3c" />
    <meta property="og:title" content="Modern noise machine" />
    <meta
      property="og:description"
      content="A modern noise machine for today's world — white, pink, and brown noise alongside screaming, construction, traffic, beeping, and spooky soundscapes."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://modern-noise.web.app/" />
    <meta
      property="og:image"
      content="https://modern-noise.web.app/img/modern-noise-machine-1024.jpg"
    />
    <link rel="icon" href="/img/modern-noise-machine-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Kode+Mono&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Emoji&text=%E2%8F%B8%E2%96%B6%E2%AC%9C%F0%9F%8E%83%F0%9F%91%84%F0%9F%91%8B%F0%9F%91%BB%F0%9F%92%80%F0%9F%92%BB%F0%9F%93%9F%F0%9F%98%B1%F0%9F%9A%97%F0%9F%9A%98%F0%9F%9A%A7%F0%9F%9A%A8%F0%9F%9B%A0%F0%9F%9F%A4%F0%9F%A6%87%F0%9F%A9%B7&display=swap"
      rel="stylesheet"
    />
    <link href="/style.css" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <title>Modern noise machine</title>
  </head>
  <body>
    <audio id="audio-source" src="/audio/background.mp3" preload="auto"></audio>

    <main>
      <h1 id="noise-machine-title">
        Modern noise <abbr title="Audio Interface">AI</abbr> <br /><span
          lang="ja"
          >ひどい気分</span
        >
      </h1>

      <section id="lcd-screen" aria-label="Status display">
        <span id="white-icon" class="lcd-icon lcd-icon-on" aria-hidden="true"
          >⬜</span
        >
        <span id="pink-icon" class="lcd-icon" aria-hidden="true">🩷</span>
        <span id="brown-icon" class="lcd-icon" aria-hidden="true">🟤</span>
        <span id="screaming-icon" class="lcd-icon" aria-hidden="true">😱</span>
        <span id="building-icon" class="lcd-icon" aria-hidden="true">🚧</span>
        <span id="traffic-icon" class="lcd-icon" aria-hidden="true">🚘</span>
        <span id="beeping-icon" class="lcd-icon" aria-hidden="true">🚨</span>
        <span id="spooky-icon" class="lcd-icon" aria-hidden="true">🎃</span>
        <span
          class="lcd-text"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        >
          <span class="lcd-on">White</span>
          <span class="lcd-off" aria-hidden="true"></span>
          &nbsp;
        </span>
        <span id="play-icon" class="lcd-icon" aria-hidden="true">▶</span>
      </section>

      <section id="buttons" aria-label="Noise controls">
        <input
          id="volume-slider"
          aria-label="Volume"
          aria-valuetext="100%"
          type="range"
          min="0"
          max="2"
          step="0.01"
          value="1"
        />

        <button
          id="white"
          type="button"
          aria-label="White noise"
          class="noise-button"
        >
          <span class="grey">W</span>
        </button>
        <button
          id="pink"
          type="button"
          aria-label="Pink noise"
          class="noise-button"
        >
          <span class="grey">P</span>
        </button>
        <button
          id="brown"
          type="button"
          aria-label="Brown noise"
          class="noise-button"
        >
          <span class="grey">B</span>
        </button>

        <button
          id="screaming"
          type="button"
          aria-label="Screaming noise"
          class="noise-button"
        >
          <span class="black">👄</span>
        </button>
        <button
          id="building"
          type="button"
          aria-label="Building noise"
          class="noise-button"
        >
          <span class="black">🛠</span>
        </button>
        <button
          id="traffic"
          type="button"
          aria-label="Traffic noise"
          class="noise-button"
        >
          <span class="black">🚗</span>
        </button>

        <button
          id="beeping"
          type="button"
          aria-label="Beeping noise"
          class="noise-button"
        >
          <span class="black">📟</span>
        </button>
        <button
          id="spooky"
          type="button"
          aria-label="Spooky noise"
          class="noise-button"
        >
          <span class="black">💀</span>
        </button>

        <button
          id="pause"
          type="button"
          aria-label="Pause noise"
          class="noise-button"
        >
          <span class="orange">⏸</span>
        </button>
        <button
          id="play"
          type="button"
          aria-label="Play noise"
          class="noise-button"
        >
          <span class="orange">▶</span>
        </button>
      </section>
    </main>
    <footer>
      <p>
        👋 Built by <a href="https://rowan.fyi/posts/modern-noise">rowan.fyi</a>
      </p>
      <p>
        💻 Code on
        <a href="https://github.com/rowan-m/modern-noise/"
          >rowan-m/modern-noise</a
        >
      </p>
    </footer>
    <script type="module" src="/bring-the-noise.js"></script>
  </body>
</html>
